version: "3"

tasks:
  init-dev:
    cmds:
      - 'powershell.exe -Command "if (Test-Path .venv) { rm -r .venv }"'
      - uv venv .venv
      - 'powershell.exe -Command ".\.venv\Scripts\activate"'
      - uv sync --group dev

  run-api:
    desc: Run the FastAPI application in development mode
    cmds:
      - uv run uvicorn services.api.main:app --reload

  run-dagster:
    desc: Run Dagster in development mode
    cmds:
      - uv run dagster dev -m orchestration.definitions

  run-tests:
    desc: Run all unit and integration tests
    cmds:
      - uv run pytest tests

  reset-catalog:
    desc: Remove the local Iceberg catalog database and warehouse files
    cmds:
      - 'powershell.exe -NoProfile -Command "if (Test-Path ''.local\\iceberg\\catalog.db'') { Remove-Item ''.local\\iceberg\\catalog.db'' -Force }"'
      - 'powershell.exe -NoProfile -Command "if (Test-Path ''.local\\iceberg\\warehouse'') { Remove-Item ''.local\\iceberg\\warehouse'' -Recurse -Force }"'
      - 'powershell.exe -NoProfile -Command "New-Item ''.local\\iceberg\\warehouse'' -ItemType Directory -Force | Out-Null"'

  create-tables:
    desc: Create the Iceberg namespace and local lakehouse tables
    cmds:
      - uv run python catalog/create_tables.py

  write-locations:
    desc: Ingest the default location dimension data
    cmds:
      - uv run python pipelines/ingestion/write_locations.py

  write-bronze-weather:
    desc: Ingest weather data for the default location into Bronze
    cmds:
      - uv run python pipelines/ingestion/write_bronze_weather_feed.py

  write-silver-weather:
    desc: Rebuild the Silver hourly weather feed table
    cmds:
      - uv run python pipelines/loading/write_silver_weather_feed.py

  write-fact-weather:
    desc: Rebuild the Gold daily weather fact table
    cmds:
      - uv run python pipelines/transformations/write_fact_weather.py

  bootstrap-local:
    desc: Reset local state and rebuild the full location-aware pipeline
    cmds:
      - task: reset-catalog
      - task: create-tables
      - task: write-locations
      - task: write-bronze-weather
      - task: write-silver-weather
      - task: write-fact-weather

  bump-patch:
    desc: Bump the patch version
    cmds:
      - uv run bump-my-version bump patch

  bump-minor:
    desc: Bump the minor version
    cmds:
      - uv run bump-my-version bump minor

  bump-major:
    desc: Bump the major version
    cmds:
      - uv run bump-my-version bump major
