version: "3"

tasks:
  run-dev-dagster:
    desc: Run the Dagster pipeline in development mode with the Dagit UI
    cmds:
      - uv run dagster dev -m orchestration.definitions
  run-pipeline:
    desc: Run the Dagster pipeline
    cmds:
      - uv run dagster job execute --job-name=weather_pipeline
  reset-catalog:
    desc: Remove the local Iceberg catalog database and warehouse files
    cmds:
      - 'powershell.exe -NoProfile -Command "Remove-Item ''.local\\iceberg\\pyiceberg_catalog.db'' -Force -ErrorAction SilentlyContinue"'
      - 'powershell.exe -NoProfile -Command "Remove-Item ''.local\\iceberg\\warehouse'' -Recurse -Force -ErrorAction SilentlyContinue"'
      - 'powershell.exe -NoProfile -Command "New-Item ''.local\\iceberg\\warehouse'' -ItemType Directory -Force | Out-Null"'

  create-tables:
    desc: Create the Iceberg namespace and local Bronze and Silver tables
    cmds:
      - uv run python catalog/create_tables.py

  bump-patch:
    desc: Bump the patch version
    cmds:
      - uv run bump-my-version bump patch

  bump-minor:
    desc: Bump the minor version
    cmds:
      - uv run bump-my-version bump minor

  bump-major:
    desc: Bump the major version
    cmds:
      - uv run bump-my-version bump major
